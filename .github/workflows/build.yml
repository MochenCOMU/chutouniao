name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: 编译主程序 + 打安装包
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./build.ps1

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: Chutouniao-Setup
          path: dist/*.exe
          if-no-files-found: error
